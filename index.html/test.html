<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Workspace</title>
</head>
<body>
    <fieldset>
      <legend>Create Your Workspace Form</legend>

      <p>● GET STARTED</p>
      <h1>Create your workspace</h1>
      <hr>

      <table>
        
        <tr>
          <td><label for="fullname">Full name</label></td>
        </tr>
        <tr>
          <td><input type="text" id="fullname" name="fullname" placeholder="Jane Doe" required></td>
        </tr>
        
        <tr>
          <td><label for="phone">Phone number</label></td>
        </tr>
        <tr>
          <td><input type="tel" id="phone" name="phone" placeholder="5551234567"></td>
        </tr>
        
        <tr>
          <td><label for="dob">Date of birth</label></td>
        </tr>
        <tr>
          <td><input type="date" id="dob" name="dob"></td>
        </tr>
        
        <tr>
          <td><label for="email">Work email</label></td>
        </tr>
        <tr>
          <td><input type="email" id="email" name="email" placeholder="jane@company.com" required></td>
        </tr>
        
        <tr>
          <td><label for="password">Password</label></td>
        </tr>
        <tr>
          <td><input type="password" id="password" name="password" placeholder="At least 8 characters" required></td>
        </tr>
        
        <tr>
          <td>
            <label><input type="checkbox" name="updates" checked> Email me product updates and tips</label><br>
            <label><input type="checkbox" name="terms" required> I agree to the Terms & Privacy Policy</label>
          </td>
        </tr>
        
        <tr>
          <td>
            <button type="submit">Create workspace</button>
            <button type="reset">Reset</button>
          </td>
        </tr>

      </table>
    </fieldset>

</body>
</html>
