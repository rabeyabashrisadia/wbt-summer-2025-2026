<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lab Task 05 - JavaScript Form Validation Using DOM </title>
    <script>
        function validateForm() {
            var fname = document.getElementById("fname").value;
            var lname = document.getElementById("lname").value;
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var terms = document.getElementById("terms").checked;

            if (fname == "") {
                alert("First Name must be filled out");
                return false;
            }

            if (lname == "") {
                alert("Last Name must be filled out");
                return false;
            }

            if (email == "") {
                alert("Email must be filled out");
                return false;
            }
            if (email.indexOf("@") == -1) {
                alert("Invalid email format! Must contain '@'");
                return false;
            }

            if (password == "") {
                alert("Password must be filled out");
                return false;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters long");
                return false;
            }

            if (terms == false) {
                return false;
            }

            alert("Successful");
            return true;
        }
    </script>
</head>
<body>

    <h2>Lab Task 05: JavaScript Form Validation Using DOM </h2>
    
    <form name="myForm" action="/action_page.php" onsubmit="return validateForm()" method="post">
        
        First Name: <input type="text" id="fname" name="fname"><br><br>
        
        Last Name: <input type="text" id="lname" name="lname"><br><br>
        
        Email Address: <input type="text" id="email" name="email"><br><br>
        
        Password: <input type="password" id="password" name="password"><br><br>
        
        <input type="checkbox" id="terms" name="terms"> 
        <label for="terms">I agree to the terms and conditions</label><br><br>
        
        <input type="submit" value="Submit">
    </form>

</body>
</html>
